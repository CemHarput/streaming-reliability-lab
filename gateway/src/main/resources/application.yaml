spring:
  application:
    name: streaming-gateway
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

lab:
  connection-mode: shared
  upstream:
    target: localhost:50051
    stream-deadline: 60s
  shutdown:
    drain-timeout: 10s
    channel-termination-timeout: 5s

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,upstreamChannel
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
