spring:
  application:
    name: streaming-gateway
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

lab:
  connection-mode: shared
  upstream:
    target: localhost:50051
    stream-deadline: 60s
  limits:
    max-active-streams: 100
    overload-policy: reject
    queue-wait: 5s
    max-waiting: 100
    stream-queue-capacity: 16
  timeouts:
    first-chunk: 30s
    idle-between-chunks: 30s
  retry:
    max-attempts: 3
    initial-backoff: 100ms
    max-backoff: 2s
  shutdown:
    drain-timeout: 10s
    channel-termination-timeout: 5s

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,upstreamChannel
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
